# VPS dashboard — dedicated TLS port, reverse-proxy to the local Node process.
# Install:
#   sudo cp deploy/nginx-monitor.conf /etc/nginx/sites-available/monitor
#   sudo ln -sf /etc/nginx/sites-available/monitor /etc/nginx/sites-enabled/monitor
#   sudo ufw allow 9443/tcp
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name your-domain.example.com;

    access_log /var/log/nginx/monitor.access.log;
    error_log  /var/log/nginx/monitor.error.log;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2M;

    # Everything (frontend, /api, /ingest, /login, /install) -> local dashboard process.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
